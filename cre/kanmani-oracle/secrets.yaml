# CRE secrets for the slashing workflow.
#
# The workflow reads a secret ONLY when a target sets `broadcast: true`. The judged simulation leaves
# broadcast unset, so no secret is fetched and this file is inert there.
#
# When broadcasting, the workflow signs the verdict with the Sclera attestor key. That key's address is
# 0x358c591aD7D60aC36bC223472B41518A7FA7b44A, the immutable attestor on the deployed Sclera, derived
# from the house key via tools/oracle-attestor.mjs under the label kanmani.sclera.attestor.v1. Provide
# the private half here at deploy time (or through the CRE vault) under this id and namespace. It is a
# 0x-prefixed 32-byte hex key. Never commit the value.
secrets:
  - id: SCLERA_ATTESTOR_KEY
    namespace: main
    # value: supplied at deploy, never committed
