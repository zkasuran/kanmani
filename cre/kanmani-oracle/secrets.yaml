# CRE secrets for the slashing workflow.
#
# The workflow reads a secret ONLY when a target sets `broadcast: true`. The judged simulation leaves
# broadcast unset, so no secret is fetched and this file is inert there.
#
# When broadcasting, the workflow signs the verdict with the Sclera attestor key. That key's address is
# 0x358c591aD7D60aC36bC223472B41518A7FA7b44A, the immutable attestor on the deployed Sclera. It is the
# operator's Iris onchain attestation key (kanmani.optic-onchain.v1), derived from a passkey on
# /account on 2026-09-24, NOT the house-derived key from tools/oracle-attestor.mjs (that one is
# 0x9C517a3F00b9201A9dA7c26F04f64CDAfB04d874 and is pinned by nothing). No server holds this key, so a
# broadcast needs it exported from that passkey ceremony. It is a 0x-prefixed 32-byte hex key. Never
# commit the value.
secrets:
  - id: SCLERA_ATTESTOR_KEY
    namespace: main
    # value: supplied at deploy, never committed
