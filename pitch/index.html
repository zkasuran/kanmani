<script src="film.js"></script>
<script>
  // Open this file in a browser (served over http) to scrub the film: ?t=seconds, or play it live.
  const q = new URLSearchParams(location.search);
  film.ready.then(() => {
    if (q.has("t")) return film.renderFrame(Number(q.get("t")));
    if (!q.has("play")) return;
    const t0 = performance.now();
    const tick = () => { const t = (performance.now() - t0) / 1000; if (t < film.DURATION) { film.renderFrame(t); requestAnimationFrame(tick); } };
    tick();
  });
</script>
