<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Four outcomes: true, false, noClaim, unknown. Unknown is never false and a null is never zero.">
<title>Four outcomes: true, false, noClaim, unknown. Unknown is never false and a null is never zero.</title>
<style>
.sans{font-family:'Space Grotesk','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.in{animation:in .9s cubic-bezier(.16,1,.3,1) backwards;animation-delay:var(--d,0s)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .rm-hide{opacity:0!important}
}
</style>

<defs>
  <radialGradient id="g0" cx="0.5" cy="-0.4" r=".75"><stop offset="0" stop-color="#836ef9" stop-opacity="0.180"/><stop offset="1" stop-color="#836ef9" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#1d2836" stroke-width="1"/>
  </pattern>
  <radialGradient id="gridmask-g" cx=".5" cy="0" r=".9">
    <stop offset=".2" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridmask"><rect width="1280" height="330" fill="url(#gridmask-g)"/></mask>
  <linearGradient id="edge" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="frame"><rect width="1280" height="330" rx="24"/></clipPath>
</defs>
<rect width="1280" height="330" rx="24" fill="#05070a"/>
<g clip-path="url(#frame)">
  <rect width="1280" height="330" rx="24" fill="url(#g0)"/>
  <rect width="1280" height="330" fill="url(#grid)" mask="url(#gridmask)"/>
</g>
<rect x=".5" y=".5" width="1279" height="329" rx="23.5" fill="none" stroke="#2b3a4d" stroke-opacity=".8"/>
<rect x="120" y="0" width="1040" height="1" fill="url(#edge)"/>

<g class="in" style="--d:0s"><rect x="72" y="61" width="22" height="1.5" fill="#836ef9"/><text x="104" y="66" class="mono" font-size="12.5" letter-spacing="2.6" fill="#836ef9">FOUR OUTCOMES, ONE RULE</text></g>
<text x="72" y="100" class="sans in" style="--d:.1s" font-size="26" font-weight="600" letter-spacing="-.6" fill="#dce5f0"><tspan class="mono" fill="#94a3b8">unknown</tspan> is never <tspan class="mono" fill="#f87171">false</tspan> and a null is never <tspan class="mono">0</tspan>.</text>

<g class="in" style="--d:0.20s">
  <rect x="72" y="120" width="270" height="128" rx="14" fill="#06281f" stroke="#34d399" stroke-opacity=".35"/>
  <rect x="94" y="142" width="60" height="26" rx="6" fill="#05070a" fill-opacity=".35" stroke="#34d399" stroke-opacity=".4"/>
  <text x="105" y="160" class="mono" font-size="14" font-weight="600" fill="#34d399">true</text>
  <text x="94" y="196" class="body" font-size="13.5" fill="#dce5f0" fill-opacity=".82"><tspan x="94" dy="0">The cited transaction is on the</tspan><tspan x="94" dy="19">chain the document names.</tspan></text>
</g>
<g class="in" style="--d:0.28s">
  <rect x="360" y="120" width="270" height="128" rx="14" fill="#2c1014" stroke="#f87171" stroke-opacity=".35"/>
  <rect x="382" y="142" width="69" height="26" rx="6" fill="#05070a" fill-opacity=".35" stroke="#f87171" stroke-opacity=".4"/>
  <text x="393" y="160" class="mono" font-size="14" font-weight="600" fill="#f87171">false</text>
  <text x="382" y="196" class="body" font-size="13.5" fill="#dce5f0" fill-opacity=".82"><tspan x="382" dy="0">We read that chain successfully</tspan><tspan x="382" dy="19">and the transaction is not</tspan><tspan x="382" dy="19">there.</tspan></text>
</g>
<g class="in" style="--d:0.36s">
  <rect x="648" y="120" width="270" height="128" rx="14" fill="#121820" stroke="#64748b" stroke-opacity=".35"/>
  <rect x="670" y="142" width="88" height="26" rx="6" fill="#05070a" fill-opacity=".35" stroke="#64748b" stroke-opacity=".4"/>
  <text x="681" y="160" class="mono" font-size="14" font-weight="600" fill="#64748b">noClaim</text>
  <text x="670" y="196" class="body" font-size="13.5" fill="#dce5f0" fill-opacity=".82"><tspan x="670" dy="0">The document parsed and asserts</tspan><tspan x="670" dy="19">no payment. Nothing to resolve.</tspan></text>
</g>
<g class="in" style="--d:0.44s">
  <rect x="936" y="120" width="270" height="128" rx="14" fill="#171f2b" stroke="#94a3b8" stroke-opacity=".35"/>
  <rect x="958" y="142" width="88" height="26" rx="6" fill="#05070a" fill-opacity=".35" stroke="#94a3b8" stroke-opacity=".4"/>
  <text x="969" y="160" class="mono" font-size="14" font-weight="600" fill="#94a3b8">unknown</text>
  <text x="958" y="196" class="body" font-size="13.5" fill="#dce5f0" fill-opacity=".82"><tspan x="958" dy="0">We could not look or could not</tspan><tspan x="958" dy="19">read what we fetched. Never an</tspan><tspan x="958" dy="19">accusation.</tspan></text>
</g>
<text x="72" y="294" class="body in" style="--d:.6s" font-size="14" fill="#5d6d85">Enforced in the types, in the contract, in the SQL and in the UI. A failure to look is not a finding against anybody.</text>

</svg>
