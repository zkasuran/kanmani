<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-label="Kanmani: the settlement and trust layer for agent work on Monad. Trust stops being a badge. It becomes a price.">
<title>Kanmani: the settlement and trust layer for agent work on Monad. Trust stops being a badge. It becomes a price.</title>
<style>
.sans{font-family:'Space Grotesk','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.in{animation:in .9s cubic-bezier(.16,1,.3,1) backwards;animation-delay:var(--d,0s)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.mk path,.mk circle{transform-box:fill-box;transform-origin:center}
.mk-l{animation:mkl 1s cubic-bezier(.16,1,.3,1) .15s backwards}
.mk-r{animation:mkr 1s cubic-bezier(.16,1,.3,1) .15s backwards}
.mk-n{animation:mkn .8s cubic-bezier(.34,1.56,.64,1) .7s backwards}
@keyframes mkl{from{opacity:0;transform:translateX(-6px)}}
@keyframes mkr{from{opacity:0;transform:translateX(6px)}}
@keyframes mkn{from{transform:scale(0)}}

.ap *{transform-box:view-box;transform-origin:200px 200px}
.ap .tk,.ap .bk{transform-origin:0 0}
.rg{fill:none;stroke:#cbd5e1;stroke-width:1}
.rg-d{stroke:#6d28d9;stroke-dasharray:2 9;opacity:.6}
.tk{stroke:#cbd5e1;stroke-width:1}.tk-m{stroke:#64748b;stroke-width:1.4}
.sp-slow{animation:spin 90s linear infinite}
.sp-rev{animation:spin 60s linear infinite reverse}
.sp-orbit{animation:spin 48s linear infinite}
.bk{fill:#f1f5f9;stroke:#cbd5e1;animation:bt 4s cubic-bezier(.65,0,.35,1) infinite}
.bk-l{fill:#ddd6fe;stroke:#6d28d9}
@keyframes bt{0%,70%,100%{opacity:.55}80%{opacity:1}}
.sw{animation:spin 8s linear infinite}
.wr{stroke:#cbd5e1;stroke-dasharray:3 5}
.bm{transform-origin:96px 200px;animation:bm 8s cubic-bezier(.65,0,.35,1) 2s infinite}
@keyframes bm{0%,8%{transform:scaleX(0);opacity:0}30%{transform:scaleX(.5);opacity:1}62%{transform:scaleX(1);opacity:1}80%,100%{transform:scaleX(1);opacity:0}}
.rl{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:260}
.rl-l{animation:dr 1.6s cubic-bezier(.16,1,.3,1) .3s backwards,cl 8s cubic-bezier(.65,0,.35,1) 2s infinite}
.rl-r{animation:dr 1.6s cubic-bezier(.16,1,.3,1) .3s backwards,cr 8s cubic-bezier(.65,0,.35,1) 2s infinite}
@keyframes dr{from{stroke-dashoffset:260}}
@keyframes cl{0%,25%,60%,100%{transform:none}38%,46%{transform:translateX(10px)}}
@keyframes cr{0%,25%,60%,100%{transform:none}38%,46%{transform:translateX(-10px)}}
.pk{fill:#0f172a;opacity:0}
.pk-in{animation:pi 8s cubic-bezier(.65,0,.35,1) 2s infinite}
.pk-out{fill:#0891b2;animation:po 8s cubic-bezier(.65,0,.35,1) 2s infinite}
@keyframes pi{0%{transform:translateX(0);opacity:0}6%{opacity:1}34%{transform:translateX(96px);opacity:1}38%,100%{transform:translateX(96px);opacity:0}}
@keyframes po{0%,48%{transform:translateX(0) scale(.4);opacity:0}52%{transform:translateX(6px);opacity:1}78%{transform:translateX(96px);opacity:1}84%,100%{transform:translateX(96px);opacity:0}}
.gl{animation:gl 8s cubic-bezier(.65,0,.35,1) 2s infinite}
@keyframes gl{0%,30%,70%,100%{opacity:.65;transform:scale(1)}42%{opacity:1;transform:scale(1.08)}}
.nd{fill:#cffafe;stroke:#0891b2;stroke-width:1.5;animation:nl 1s cubic-bezier(.34,1.56,.64,1) 1.1s backwards,nb 8s cubic-bezier(.65,0,.35,1) 2s infinite}
.cr{animation:nl 1s cubic-bezier(.34,1.56,.64,1) 1.2s backwards}
@keyframes nl{from{transform:scale(0)}}
@keyframes nb{0%,34%,56%,100%{transform:scale(1)}40%{transform:scale(1.18)}}
.pl{fill:none;stroke:#0891b2;stroke-width:1.2;opacity:0;animation:pu 8s cubic-bezier(.25,1,.5,1) infinite}
@keyframes pu{0%,38%{transform:scale(.7);opacity:0}40%{opacity:.85}66%,100%{transform:scale(4.4);opacity:0}}

.live{animation:lv 2.4s cubic-bezier(.65,0,.35,1) infinite}
@keyframes lv{0%,100%{opacity:1}50%{opacity:.35}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .rm-hide{opacity:0!important}
}
</style>

