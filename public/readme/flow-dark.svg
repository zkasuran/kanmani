<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="How the money moves: escrow, deliver, settle, price it.">
<title>How the money moves: escrow, deliver, settle, price it.</title>
<style>
.sans{font-family:'Space Grotesk','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.in{animation:in .9s cubic-bezier(.16,1,.3,1) backwards;animation-delay:var(--d,0s)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.ring{opacity:.15;animation:rg 6.4s cubic-bezier(.65,0,.35,1) infinite}
@keyframes rg{0%,100%{opacity:.15}6%,20%{opacity:1}}
.wave{opacity:0;transform-box:fill-box;transform-origin:center;animation:wv 6.4s cubic-bezier(.25,1,.5,1) infinite}
@keyframes wv{0%{opacity:.8;transform:scale(1)}22%,100%{opacity:0;transform:scale(1.9)}}
.pkt{animation:pk 6.4s cubic-bezier(.65,0,.35,1) infinite}
@keyframes pk{0%{transform:translateX(0px)}12%{transform:translateX(0px)}25%{transform:translateX(320px)}37%{transform:translateX(320px)}50%{transform:translateX(640px)}62%{transform:translateX(640px)}75%{transform:translateX(960px)}87%{transform:translateX(960px)}100%{transform:translateX(960px);opacity:0}}
.trail{stroke-dasharray:4 8;animation:tr 1.2s linear infinite}
@keyframes tr{to{stroke-dashoffset:-12}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .rm-hide{opacity:0!important}
}
</style>

<defs>
  <radialGradient id="g0" cx="0.5" cy="-0.3" r=".75"><stop offset="0" stop-color="#836ef9" stop-opacity="0.220"/><stop offset="1" stop-color="#836ef9" stop-opacity="0"/></radialGradient><radialGradient id="g1" cx="0.95" cy="1.1" r=".75"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.080"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#1d2836" stroke-width="1"/>
  </pattern>
  <radialGradient id="gridmask-g" cx=".5" cy="0" r=".9">
    <stop offset=".2" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridmask"><rect width="1280" height="470" fill="url(#gridmask-g)"/></mask>
  <linearGradient id="edge" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="frame"><rect width="1280" height="470" rx="24"/></clipPath>
</defs>
<rect width="1280" height="470" rx="24" fill="#05070a"/>
<g clip-path="url(#frame)">
  <rect width="1280" height="470" rx="24" fill="url(#g0)"/><rect width="1280" height="470" rx="24" fill="url(#g1)"/>
  <rect width="1280" height="470" fill="url(#grid)" mask="url(#gridmask)"/>
</g>
<rect x=".5" y=".5" width="1279" height="469" rx="23.5" fill="none" stroke="#2b3a4d" stroke-opacity=".8"/>
<rect x="120" y="0" width="1040" height="1" fill="url(#edge)"/>

<g class="in" style="--d:0s"><rect x="72" y="67" width="22" height="1.5" fill="#836ef9"/><text x="104" y="72" class="mono" font-size="12.5" letter-spacing="2.6" fill="#836ef9">HOW THE MONEY MOVES</text></g>
<text x="72" y="124" class="sans in" style="--d:.1s" font-size="34" font-weight="600" letter-spacing="-1" fill="#dce5f0">The receipt is produced by the payment, not written about it afterwards.</text>
<line x1="160" y1="232" x2="1120" y2="232" stroke="#2b3a4d" stroke-width="2"/>
<line x1="160" y1="232" x2="1120" y2="232" stroke="#836ef9" stroke-opacity=".6" stroke-width="2" class="trail"/>

<g class="in" style="--d:0.30s">
  <circle cx="160" cy="232" r="34" fill="#0b0f16" stroke="#2b3a4d"/>
  <circle cx="160" cy="232" r="34" fill="none" stroke="#22d3ee" stroke-width="1.5" class="ring" style="animation-delay:0.00s"/>
  <circle cx="160" cy="232" r="34" fill="none" stroke="#22d3ee" class="wave rm-hide" style="animation-delay:0.00s"/>
  <text x="160" y="238" text-anchor="middle" class="mono" font-size="16" font-weight="600" fill="#836ef9">01</text>
  <text x="160" y="304" text-anchor="middle" class="mono" font-size="13" letter-spacing="2.4" fill="#dce5f0">ESCROW</text>
  <text x="160" y="334" text-anchor="middle" class="body" font-size="14" fill="#7f8ea3"><tspan x="160" dy="0">The buyer locks USDC against</tspan><tspan x="160" dy="21">terms. The job id is derived,</tspan><tspan x="160" dy="21">never supplied.</tspan></text>
</g>
<g class="in" style="--d:0.42s">
  <circle cx="480" cy="232" r="34" fill="#0b0f16" stroke="#2b3a4d"/>
  <circle cx="480" cy="232" r="34" fill="none" stroke="#22d3ee" stroke-width="1.5" class="ring" style="animation-delay:1.60s"/>
  <circle cx="480" cy="232" r="34" fill="none" stroke="#22d3ee" class="wave rm-hide" style="animation-delay:1.60s"/>
  <text x="480" y="238" text-anchor="middle" class="mono" font-size="16" font-weight="600" fill="#836ef9">02</text>
  <text x="480" y="304" text-anchor="middle" class="mono" font-size="13" letter-spacing="2.4" fill="#dce5f0">DELIVER</text>
  <text x="480" y="334" text-anchor="middle" class="body" font-size="14" fill="#7f8ea3"><tspan x="480" dy="0">The agent delivers. Both sides</tspan><tspan x="480" dy="21">have an exit that does not need</tspan><tspan x="480" dy="21">the other to reply.</tspan></text>
</g>
<g class="in" style="--d:0.54s">
  <circle cx="800" cy="232" r="34" fill="#0b0f16" stroke="#2b3a4d"/>
  <circle cx="800" cy="232" r="34" fill="none" stroke="#22d3ee" stroke-width="1.5" class="ring" style="animation-delay:3.20s"/>
  <circle cx="800" cy="232" r="34" fill="none" stroke="#22d3ee" class="wave rm-hide" style="animation-delay:3.20s"/>
  <text x="800" y="238" text-anchor="middle" class="mono" font-size="16" font-weight="600" fill="#836ef9">03</text>
  <text x="800" y="304" text-anchor="middle" class="mono" font-size="13" letter-spacing="2.4" fill="#dce5f0">SETTLE</text>
  <text x="800" y="334" text-anchor="middle" class="body" font-size="14" fill="#7f8ea3"><tspan x="800" dy="0">Payment and receipt in one</tspan><tspan x="800" dy="21">transaction. Unspent metered funds</tspan><tspan x="800" dy="21">return in the same call.</tspan></text>
</g>
<g class="in" style="--d:0.66s">
  <circle cx="1120" cy="232" r="34" fill="#0b0f16" stroke="#2b3a4d"/>
  <circle cx="1120" cy="232" r="34" fill="none" stroke="#22d3ee" stroke-width="1.5" class="ring" style="animation-delay:4.80s"/>
  <circle cx="1120" cy="232" r="34" fill="none" stroke="#22d3ee" class="wave rm-hide" style="animation-delay:4.80s"/>
  <text x="1120" y="238" text-anchor="middle" class="mono" font-size="16" font-weight="600" fill="#836ef9">04</text>
  <text x="1120" y="304" text-anchor="middle" class="mono" font-size="13" letter-spacing="2.4" fill="#dce5f0">PRICE IT</text>
  <text x="1120" y="334" text-anchor="middle" class="body" font-size="14" fill="#7f8ea3"><tspan x="1120" dy="0">The claim-truth rate that falls</tspan><tspan x="1120" dy="21">out becomes the bond, the odds and</tspan><tspan x="1120" dy="21">the credit line.</tspan></text>
</g>
<g class="pkt rm-hide"><circle cx="160" cy="198" r="6" fill="#22d3ee"/><circle cx="160" cy="198" r="12" fill="#22d3ee" opacity=".2"/></g>
<text x="640" y="438" text-anchor="middle" class="mono in" style="--d:.9s" font-size="13" fill="#5d6d85">on mainnet  ·  <tspan fill="#dce5f0">1.40</tspan> escrowed  ·  <tspan fill="#dce5f0">30 of 70</tspan> calls used  ·  <tspan fill="#dce5f0">0.60</tspan> to the agent  ·  <tspan fill="#dce5f0">0.80</tspan> returned in the same transaction  ·  <tspan fill="#dce5f0">0</tspan> retained</text>

</svg>
