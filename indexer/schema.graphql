# Retina's schema. The shape here is driven by one measured fact: an agent's evidence and its
# truth are different things, so they are different entities with different lifecycles.
#
# Measured 2026-09-13 over all 10,252 Monad agents and a 500-feedback sample:
#   8,093 agents (78.94%) share ONE tokenURI and that URI is a deleted Vercel deployment
#   2,031 distinct records across 10,252 agents, so 8,221 are duplicates of another record
#   68 of 68 fetched evidence documents were hash-perfect
#   68 of 68 declared network: monad and 2 of those payments exist on Monad
#
# So: Record is deduplicated by content hash (storing 8,093 copies of one dead URL is waste and
# hides the cluster). Verdicts live in the fovea schema rather than here, append-only, so a fixed
# template reads as false -> true rather than as a silent edit.

# NOTE: no PER-CHAIN entity declares `chainId`. With `disable_default_cross_chain: true` envio adds
# it to every per-chain entity automatically and declaring it yourself is a hard codegen error. Add
# `@crossChain` to an entity if its rows should instead be shared across chains. A cross-chain
# entity gets no automatic column, so that is the one place a `chainId` field is allowed. It goes
# in the ID as well when rows need to stay apart per chain. See Chiasm at the bottom.

type Agent {
  id: ID! # chainId_agentId
  agentId: BigInt!
  owner: String!
  # From the reserved "agentWallet" metadata key, written on every registration. Distinct from
  # owner: the owner holds the ERC-721, the wallet is what the agent transacts with.
  agentWallet: String
  tokenUri: String
  # keccak of tokenUri. The join key to Record and what makes the 78.94% cluster visible.
  uriHash: String
  name: String
  # Absolute http(s) endpoints only. A relative or scheme-less value cannot be probed.
  endpoints: [String!]!
  # The operator's own claim that it speaks x402. Both spellings occur in the wild.
  declaresX402: Boolean!
  registeredAtBlock: BigInt!
  registeredAt: BigInt!
  lastSeenBlock: BigInt!
  # Rises only on evidence, never falls on a transient failure. See Fovea.
  rung: String!
  transferCount: Int!
  metadataUpdateCount: Int!
  feedbacks: [Feedback!]! @derivedFrom(field: "agent")
  validations: [Validation!]! @derivedFrom(field: "agent")
}

# NAMED AgentRecord, NOT Record. Codegen emits `export type <Entity> = ...` inside the `envio`
# module, so an entity called `Record` shadows TypeScript's built-in Record<K,V> there. Every
# internal type using Record<string, ...> then breaks and the only visible symptom is
# implicit-any on every handler callback, which points nowhere near the schema.
#
# One row per DISTINCT registration document, not per agent. 10,252 agents resolve to ~2,031 of
# these. memberCount says how many agents share one, distinctOwners says how many wallets do and
# together they turn "a dead URL" into "8,093 agents across 7,962 wallets share a dead URL",
# which is the finding a judge remembers.
type AgentRecord {
  id: ID! # uriHash
  uri: String!
  # How many agents point at this exact document.
  memberCount: Int!
  # How many DISTINCT wallets registered those agents, counted at registration time.
  #
  # This is a different number from memberCount and that difference is the whole finding: 8,093
  # agents share the dead Vercel record but only 7,962 wallets do, so a few hundred operators
  # registered more than one agent against the same document. Deduplicated through
  # AgentRecordOwner rather than incremented alongside memberCount, which is what an earlier
  # version did and which made the two fields provably equal. See docs/18-BUGS-FIXED.md.
  distinctOwners: Int!
  kind: String! # data-base64 | data-plain | http | ipfs | inline-json | empty | other
  # Populated by the enrichment Effect, not by a log. 97.7% of agents point off-chain, so this
  # is the difference between an indexer that knows names and one that knows ids.
  fetchedAt: BigInt
  httpStatus: Int
  byteLength: Int
  resolves: Boolean
  parsedName: String
  firstSeenBlock: BigInt!
  owners: [AgentRecordOwner!]! @derivedFrom(field: "record")
}

# One row per (record, owner) pair. Exists so distinctOwners is a real count.
#
# Counted at REGISTRATION time, deliberately. Agent.owner moves on every Transfer, so a live
# aggregate over Agent would answer "who holds these agents now" and the published claim is
# about who registered them. This survives later transfers; an aggregate would not.
type AgentRecordOwner {
  id: ID! # uriHash_owner
  record: AgentRecord!
  owner: String!
  # How many agents this owner registered against this one document.
  agentCount: Int!
  firstSeenBlock: BigInt!
}

# The load-bearing entity. feedbackURI and feedbackHash exist ONLY in the NewFeedback event, so
# without Retina there is no way to reach the evidence at all.
type Feedback {
  id: ID! # chainId_agentId_client_index
  agent: Agent!
  clientAddress: String!
  feedbackIndex: BigInt!
  value: BigInt!
  valueDecimals: Int!
  tag1: String!
  tag2: String!
  endpoint: String!
  # The evidence pointer. Reachable through logs and nowhere else.
  feedbackUri: String!
  # The on-chain commitment. Fovea recomputes keccak256 over the raw fetched bytes and compares.
  feedbackHash: String!
  revoked: Boolean!
  revokedAtBlock: BigInt
  # An operator's on-chain right of reply, rendered beside our verdict.
  responseUri: String
  responseHash: String
  responder: String
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: String!
}

# Written by Optic. Empty on Monad when sampled 2026-09-13, which is why Kanmani writing here is
# the first-validator position rather than a claim.
type Validation {
  id: ID! # chainId_requestHash
  agent: Agent
  validatorAddress: String!
  requestHash: String!
  requestUri: String
  response: Int
  responseUri: String
  responseHash: String
  tag: String
  requestedAtBlock: BigInt!
  respondedAtBlock: BigInt
}

# Population truth, per sweep. The registry is NOT enumerable (totalSupply reverts), so the count
# comes from a storage slot and is cross-checked against what the logs produced. A gap between
# the two is the honest signal that the index is behind and /status shows it rather than hiding
# it. Muster's index froze for five days while its page reported a number true when written.
#
# The other half of the cross-check, how many rows Retina actually holds, is NOT stored here.
# An earlier version declared agentsFromLogs, feedbackCount and recordCount on this entity and
# never wrote them, so all three were permanently 0 and the gap always read as maximal. They are
# gone rather than backfilled: a denormalised counter can drift from the table it counts and
# Hasura already answers it exactly with no write cost.
#
#   query { Agent_aggregate { aggregate { count } } }
#
# See docs/18-BUGS-FIXED.md.
# Chiasm. Where the two nerves cross.
#
# One row per registration document, shared by every chain that referenced it. Everything above
# is per-chain by default and stays that way. These two entities are the only shared rows in the
# schema, because a registration document is addressed by its content rather than by where it was
# posted, so the same document can legitimately be referenced from Monad and from BSC by
# unrelated operators.
#
# `@crossChain` is the supported spelling for a shared row when `disable_default_cross_chain` is
# true. Per-chain separation inside the merge comes from the ID, `<uriHash>_<chainId>` on
# ChiasmPresence, because envio only appends its own chainId column to per-chain entities.
#
# The merged row is what the per-chain tables cannot answer. AgentRecord on Monad knows 8,093
# agents share one dead document; it cannot know whether BSC points at the same one. The join
# key is the same key AgentRecord uses, so the two layers agree by construction.
type ChiasmRecord @crossChain {
  id: ID! # uriHash. No chain in the key. That is the entity.
  # The document as named by `Registered`, so this is the document at registration time, not the
  # one `tokenURI()` returns today. `URIUpdated` is not in the indexed event list, same as for
  # AgentRecord above, so an operator who later repointed an agent is not reflected here. Checked
  # on 2026-09-23: all three cross-chain rows found so far had been repointed since. Two of the
  # three still resolve to one shared document at head. Registration time is the claim this
  # row makes. Anything about the current document is a live read, not an index read.
  uri: String!
  # How many chains referenced this document. 1 is the common case, 2 or more is the finding.
  chainCount: Int! @index
  # Ascending, so two chains writing in either order leave the same row.
  chainIds: [Int!]!
  # Agents pointing here, summed over every chain. Per-chain counts live on ChiasmPresence.
  agentCount: Int!
  # The chain that referenced it first, by block timestamp.
  firstSeenChainId: Int!
  firstSeenAt: BigInt!
  lastSeenAt: BigInt!
  # AgentRecord.id is a 64-bit content key over the URI, not a cryptographic digest, so two
  # different documents could in principle land on one row. That would read as a cross-chain hit
  # when it is a key collision. This flag is true when a later chain arrived at this key carrying
  # a different URI string, which is the only way the difference is visible. A cross-chain claim
  # is only worth making while it is false.
  uriConflict: Boolean!
  presence: [ChiasmPresence!]! @derivedFrom(field: "record")
}

# One row per (document, chain). Cross-chain too, for two reasons. A `@crossChain` parent cannot
# hold a `@derivedFrom` list of per-chain children. A per-chain entity may not declare its own
# `chainId` field either, because envio appends that column itself. So the chain lives in the ID instead,
# which is also what keeps the two chains off each other's counters: only the chain named in an ID
# ever writes that row.
type ChiasmPresence @crossChain {
  id: ID! # uriHash_chainId
  record: ChiasmRecord!
  chainId: Int! @index
  agentCount: Int!
  # The first agent id seen on this chain pointing here, so a reader can jump straight to the row.
  firstAgentId: BigInt!
  firstSeenBlock: BigInt!
  lastSeenBlock: BigInt!
  firstSeenAt: BigInt!
  lastSeenAt: BigInt!
}

type IndexState {
  id: ID! # chainId
  # eth_getStorageAt on the identity registry counter slot.
  #
  # NULLABLE on purpose and this is load-bearing. A failed RPC read must publish "unknown" and
  # a non-null BigInt! forces a 0 instead, which is exactly the lie this project exists to call
  # out. Unknown is never zero, including in our own schema.
  counterSlotCount: BigInt
  atBlock: BigInt!
  # Wall clock, written only by PopulationCheck. Freshness on /status, never consensus time.
  updatedAt: BigInt!
}
